name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 and 25 (Gradle runs on 21, the toolchain is 25, the bytecode is Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Build, run TestMain, compile against every supported paper-api line
        run: ./gradlew build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: solstice-jar
          path: build/libs/Solstice-*.jar
